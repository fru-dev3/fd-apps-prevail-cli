name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Opt into Node.js 24 on the runner so the warning from any remaining Node-20
# actions (e.g. softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2) goes away. checkout is now @v6
# (Node 24 native). GitHub deprecates Node 20 on 2026-09-16; this sets us up
# ahead of the cutover. Lift the var when the rest ship Node-24 majors.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Stage 1: build + package each platform on its native runner, then hand the
  # tarball up as a workflow artifact. Crucially, NO job touches the GitHub
  # release here — when all four matrix legs raced to create/upload the same
  # release (action-gh-release), uploads collided and assets were silently
  # dropped (v1.6.5 shipped only 2 of 4 platforms). Splitting publish into a
  # single downstream job removes the race entirely.
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
            bun-target: bun-darwin-arm64
          - target: darwin-x64
            os: macos-13
            bun-target: bun-darwin-x64
          - target: linux-x64
            os: ubuntu-latest
            bun-target: bun-linux-x64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            bun-target: bun-linux-arm64

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Scrub gate (no personal data in demo vault)
        run: bash scripts/scrub-gate.sh

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: install
        run: bun install

      - name: typecheck
        run: bun node_modules/typescript/bin/tsc --noEmit

      - name: build single binary
        run: |
          mkdir -p dist
          bun build --compile \
            --external chromium-bidi \
            --target=${{ matrix.bun-target }} \
            --outfile=dist/prevail \
            src/index.tsx
          # bundle the vault-demo, default skill packs, and operating manual alongside the binary
          cp -R vault-demo dist/vault-demo
          cp -R skill-packs dist/skill-packs
          cp AGENTS-operating.md dist/AGENTS-operating.md
          # Ship playwright-core as an ON-DISK SIDECAR next to the binary (#6).
          # bun --compile cannot make playwright-core resolvable inside /$bunfs
          # (its internals look for their package.json at the build-time
          # node_modules path), so the engine loads this real copy at runtime via
          # src/playwright-resolve.ts -> dirname(execPath)/node_modules/playwright-core.
          mkdir -p dist/node_modules
          cp -R node_modules/playwright-core dist/node_modules/playwright-core
          chmod +x dist/prevail

      - name: package
        working-directory: dist
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          tar -czf "prevail-${VERSION}-${{ matrix.target }}.tar.gz" prevail vault-demo AGENTS-operating.md node_modules
          ls -la

      - name: upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prevail-${{ matrix.target }}
          path: dist/prevail-*.tar.gz
          if-no-files-found: error

  # Stage 2: one job, after ALL builds succeed, downloads every platform tarball
  # and publishes a single release with all four assets in one call. `needs:
  # build` means a build failure on any platform blocks the release outright
  # (better a loud no-release you rerun than a silent partial one).
  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: list artifacts
        run: ls -la artifacts

      - name: publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/prevail-*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
