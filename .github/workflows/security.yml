# Security gates (audit B12 / O103). Separate from release.yml so it never
# blocks a release build, but surfaces vulnerable deps + leaked secrets on every
# push to main and every PR. Fails the check on HIGH+ advisories.
name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install deps (lockfile-frozen)
        run: bun install --frozen-lockfile
      - name: Dependency audit (fail on high)
        run: bun audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
